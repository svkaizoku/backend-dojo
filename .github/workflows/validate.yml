name: Validate exercises

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check format and answer keys
        run: node scripts/validate.mjs
      - name: Run solutions against tests
        run: node scripts/check-solutions.mjs
